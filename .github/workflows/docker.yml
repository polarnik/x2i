name: docker x2i

on:
  push:
    tags:
      - x2i-*
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to publish (e.g. 1.1.0)"
        required: true

# Least-privilege: pushing to Docker Hub does not need write access to the repo.
permissions:
  contents: read

# Avoid concurrent publishes for the same ref overwriting each other.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  # Docker Hub repository: <namespace>/<image>.
  # Change to your Docker Hub namespace if needed.
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'perfana/x2i' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Determine release / prerelease
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/x2i-* ]]; then
            version="${GITHUB_REF#refs/tags/x2i-}"
            # Stable release only when version is strictly X.Y.Z (no -alpha/-rc/etc).
            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Do not auto-assign "latest"; we control it explicitly below.
          flavor: |
            latest=false
          tags: |
            type=match,pattern=x2i-(.*),group=1
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
